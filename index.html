<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Webcam Detection</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(to right, #020617, #0f172a);
    color: white;
    text-align: center;
}

header {
    padding: 20px;
    font-size: 22px;
    font-weight: bold;
}

/* Camera */
.video-box {
    position: relative;
    display: inline-block;
}

video {
    width: 400px;
    border-radius: 10px;
}

/* Scanning Box */
.scan-box {
    position: absolute;
    border: 3px solid #22c55e;
    width: 200px;
    height: 200px;
    top: 50px;
    left: 100px;
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    0% { opacity: 0.5; }
    50% { opacity: 1; }
    100% { opacity: 0.5; }
}

/* Button */
button {
    padding: 12px 20px;
    margin-top: 15px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(to right, #3b82f6, #9333ea);
    color: white;
    cursor: pointer;
}

/* Result */
.result {
    margin-top: 20px;
    font-size: 18px;
}

</style>
</head>

<body>

<header>🤖 Live AI Webcam Detection</header>

<div class="video-box">
    <video id="video" autoplay></video>
    <div class="scan-box"></div>
</div>

<br>
<button onclick="detect()">Detect</button>

<div class="result" id="output"></div>

<script>

// Start webcam
navigator.mediaDevices.getUserMedia({ video: true })
.then(stream => {
    document.getElementById("video").srcObject = stream;
})
.catch(err => {
    alert("Camera access denied!");
});

// Fake detection
function detect(){

    let genders = ["Male","Female"];
    let ages = ["(18-25)","(25-32)","(32-40)"];

    let gender = genders[Math.floor(Math.random()*2)];
    let age = ages[Math.floor(Math.random()*ages.length)];
    let confidence = (Math.random()*20 + 80).toFixed(2);

    document.getElementById("output").innerHTML =
    `👤 ${gender}, ${age} <br> 📊 Confidence: ${confidence}%`;
}

</script>

</body>
</html>
