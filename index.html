<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Age & Gender Detection</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(to right, #020617, #0f172a);
    color: white;
}

header {
    text-align: center;
    padding: 20px;
    font-size: 22px;
    font-weight: bold;
}

/* Layout */
.main {
    display: flex;
    gap: 20px;
    padding: 20px;
}

.left { width: 70%; }
.right { width: 30%; }

/* Card */
.card {
    background: rgba(15,23,42,0.7);
    backdrop-filter: blur(10px);
    padding: 20px;
    border-radius: 15px;
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-5px);
}

/* Button */
button {
    padding: 12px 20px;
    border-radius: 8px;
    border: none;
    background: linear-gradient(to right, #3b82f6, #9333ea);
    color: white;
    cursor: pointer;
    margin-top: 10px;
}

button:hover {
    transform: scale(1.05);
}

/* Image */
img {
    max-width: 350px;
    border-radius: 10px;
    margin-top: 15px;
}

/* Loading */
.loading {
    margin-top: 15px;
    display: none;
}

/* Spinner */
.spinner {
    border: 4px solid #1e293b;
    border-top: 4px solid #3b82f6;
    border-radius: 50%;
    width: 30px;
    height: 30px;
    animation: spin 1s linear infinite;
    margin: auto;
}

@keyframes spin {
    100% { transform: rotate(360deg); }
}

/* Result */
.result {
    margin-top: 20px;
    font-size: 18px;
    opacity: 0;
    transition: 0.5s;
}

/* Confidence Bar */
.bar-bg {
    width: 100%;
    background: #1e293b;
    border-radius: 10px;
    margin-top: 10px;
}

.bar-fill {
    height: 10px;
    width: 0%;
    background: #22c55e;
    border-radius: 10px;
    transition: 1s;
}

/* Explanation */
.highlight {
    color: #38bdf8;
    font-weight: bold;
}
</style>
</head>

<body>

<header>🤖 AI Age & Gender Detection</header>

<div class="main">

<div class="left">

<div class="card">

<h3>📸 Upload Image</h3>

<input type="file" id="imageInput" accept="image/*"><br>
<button onclick="detect()">Detect</button>

<img id="preview">

<div class="loading" id="loading">
    <div class="spinner"></div>
    <p style="text-align:center;">Analyzing image...</p>
</div>

<div class="result" id="output"></div>

<div class="bar-bg">
    <div class="bar-fill" id="confidenceBar"></div>
</div>

</div>

</div>

<div class="right card">

<h3>📘 How It Works</h3>

<p><span class="highlight">Step 1:</span> Image preprocessing</p>
<p><span class="highlight">Step 2:</span> Face detection</p>
<p><span class="highlight">Step 3:</span> Gender classification</p>
<p><span class="highlight">Step 4:</span> Age estimation</p>

<p><span class="highlight">Tech:</span> OpenCV + CNN Models</p>

<p style="margin-top:20px;">
💡 This demo simulates AI predictions for visualization.
</p>

</div>

</div>

<script>

let input = document.getElementById("imageInput");
let preview = document.getElementById("preview");

input.onchange = function(){
    preview.src = URL.createObjectURL(input.files[0]);
};

function detect(){

    let loading = document.getElementById("loading");
    let output = document.getElementById("output");
    let bar = document.getElementById("confidenceBar");

    output.style.opacity = 0;
    loading.style.display = "block";
    bar.style.width = "0%";

    setTimeout(()=>{

        let genders = ["Male","Female"];
        let ages = ["(0-2)","(4-6)","(8-12)","(15-20)","(25-32)","(38-43)","(48-53)","(60-100)"];

        let gender = genders[Math.floor(Math.random()*2)];
        let age = ages[Math.floor(Math.random()*ages.length)];
        let confidence = (Math.random()*20 + 80).toFixed(2);

        loading.style.display = "none";

        // Typing effect
        let text = `👤 ${gender}, ${age}`;
        let i = 0;
        output.innerHTML = "";

        let typing = setInterval(()=>{
            output.innerHTML += text[i];
            i++;
            if(i >= text.length) clearInterval(typing);
        }, 50);

        output.style.opacity = 1;

        // Animate confidence bar
        setTimeout(()=>{
            bar.style.width = confidence + "%";
            output.innerHTML += `<br>📊 Confidence: ${confidence}%`;
        }, 800);

    }, 1500);
}

</script>

</body>
</html>
