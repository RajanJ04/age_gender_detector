<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Detection System</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(to right, #020617, #0f172a);
    color: white;
}

/* HERO */
.hero {
    text-align: center;
    padding: 30px;
}

.hero h1 {
    font-size: 30px;
}

/* Container */
.container {
    width: 90%;
    margin: auto;
}

/* Cards */
.card {
    background: rgba(15,23,42,0.7);
    padding: 20px;
    border-radius: 15px;
    margin: 20px 0;
    box-shadow: 0 0 20px rgba(59,130,246,0.2);
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-5px);
}

/* Layout */
.flex {
    display: flex;
    gap: 20px;
}

/* Left & Right */
.left { width: 65%; }
.right { width: 35%; }

/* Media */
video, img {
    width: 100%;
    border-radius: 10px;
}

/* Buttons */
button {
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    margin: 5px;
    cursor: pointer;
    background: linear-gradient(to right, #3b82f6, #9333ea);
    color: white;
    transition: 0.2s;
}

button:hover {
    transform: scale(1.05);
}

.active {
    background: #22c55e;
}

/* Stats */
.stats {
    display: flex;
    justify-content: space-around;
    text-align: center;
}

.stat h3 {
    color: #38bdf8;
}

/* Logs */
.logs {
    background: black;
    padding: 10px;
    height: 200px;
    overflow-y: auto;
    font-size: 13px;
    border-radius: 10px;
}

/* Result */
.result {
    margin-top: 15px;
    font-size: 18px;
}

/* Tech Stack */
.tech {
    text-align: center;
    padding: 15px;
}

.badge {
    display: inline-block;
    padding: 6px 10px;
    margin: 5px;
    background: #1e293b;
    border-radius: 8px;
}
</style>
</head>

<body>

<div class="hero">
    <h1>🤖 AI Age & Gender Detection System</h1>
    <p>Interactive AI Simulation with Real-Time Processing</p>
</div>

<div class="container">

<!-- STATS -->
<div class="card stats">
    <div class="stat">
        <h3>92%</h3>
        <p>Accuracy</p>
    </div>
    <div class="stat">
        <h3>CNN</h3>
        <p>Model</p>
    </div>
    <div class="stat">
        <h3>&lt;1.5s</h3>
        <p>Speed</p>
    </div>
</div>

<div class="flex">

<!-- LEFT -->
<div class="left card">

<div>
    <button onclick="showUpload()" id="uploadBtn" class="active">📸 Upload</button>
    <button onclick="showCamera()" id="camBtn">📷 Camera</button>
</div>

<div id="uploadSection">
    <input type="file" id="imageInput"><br><br>
    <img id="preview">
</div>

<div id="cameraSection" style="display:none;">
    <video id="video" autoplay></video>
</div>

<button onclick="detect()">Detect</button>

<div class="result" id="output"></div>

</div>

<!-- RIGHT -->
<div class="right card">

<h3>📊 System Logs</h3>
<div class="logs" id="logs"></div>

</div>

</div>

<!-- TECH -->
<div class="card tech">
    <span class="badge">HTML</span>
    <span class="badge">CSS</span>
    <span class="badge">JavaScript</span>
    <span class="badge">OpenCV</span>
    <span class="badge">Deep Learning</span>
</div>

</div>

<script>

let mode="upload";
let imageLoaded=false;

// Logs
function log(msg){
    let logs=document.getElementById("logs");
    logs.innerHTML += msg + "<br>";
    logs.scrollTop = logs.scrollHeight;
}

// Upload
imageInput.onchange = function(e){
    let file=e.target.files[0];
    if(file){
        preview.src=URL.createObjectURL(file);
        imageLoaded=true;
        log("[INFO] Image uploaded");
    }
};

// Tabs
function showUpload(){
    mode="upload";
    uploadSection.style.display="block";
    cameraSection.style.display="none";
    uploadBtn.classList.add("active");
    camBtn.classList.remove("active");
}

function showCamera(){
    mode="camera";
    uploadSection.style.display="none";
    cameraSection.style.display="block";
    camBtn.classList.add("active");
    uploadBtn.classList.remove("active");

    navigator.mediaDevices.getUserMedia({video:true})
    .then(stream=>{
        video.srcObject=stream;
        log("[INFO] Camera started");
    });
}

// Detect
function detect(){

    if(mode==="upload" && !imageLoaded){
        alert("Upload image first!");
        return;
    }

    log("[INFO] Processing started...");

    setTimeout(()=>{

        let source = mode==="upload" ? preview.src : "camera";

        let hash=0;
        for(let i=0;i<source.length;i++){
            hash = source.charCodeAt(i) + ((hash<<5)-hash);
        }

        let genders=["Male","Female"];
        let ages=["(18-25)","(21-28)","(25-32)","(30-40)","(40-55)"];

        let gender = genders[Math.abs(hash)%2];
        let age = ages[Math.abs(hash)%ages.length];
        let confidence = 85 + (Math.abs(hash)%10);

        log("[SUCCESS] Detection complete");

        output.innerHTML =
        `👤 ${gender}, ${age} <br> 📊 Confidence: ${confidence}%`;

    },1200);
}

</script>

</body>
</html>
