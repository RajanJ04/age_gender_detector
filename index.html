<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Detection System</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(to right, #020617, #0f172a);
    color: white;
}

/* HERO */
.hero {
    text-align: center;
    padding: 40px;
}

.hero h1 {
    font-size: 32px;
}

.hero p {
    color: #94a3b8;
}

/* Layout */
.container {
    width: 90%;
    margin: auto;
}

/* Cards */
.card {
    background: rgba(15,23,42,0.7);
    padding: 20px;
    border-radius: 15px;
    margin: 20px 0;
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-5px);
}

/* Tabs */
.tabs {
    text-align: center;
}

.tabs button {
    padding: 10px 18px;
    margin: 5px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

.active {
    background: #22c55e;
}

/* Media */
video, img {
    width: 300px;
    border-radius: 10px;
}

/* Button */
.detect-btn {
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(to right, #3b82f6, #9333ea);
    color: white;
    cursor: pointer;
}

/* Steps */
.steps {
    display: flex;
    justify-content: space-around;
    text-align: center;
}

.step {
    width: 22%;
}

.step h4 {
    color: #38bdf8;
}

/* Result */
.result {
    margin-top: 20px;
    font-size: 18px;
}

/* Loading */
.loading {
    display: none;
    margin-top: 10px;
}

</style>
</head>

<body>

<!-- HERO -->
<div class="hero">
    <h1>🤖 AI Age & Gender Detection</h1>
    <p>Real-time detection using Computer Vision & Deep Learning</p>
</div>

<div class="container">

<!-- STEPS DIAGRAM -->
<div class="card">
    <h3>📊 How It Works</h3>

    <div class="steps">
        <div class="step">
            <h4>📸 Input</h4>
            <p>Upload image or use webcam</p>
        </div>
        <div class="step">
            <h4>🧠 Process</h4>
            <p>Face detection & feature extraction</p>
        </div>
        <div class="step">
            <h4>🤖 Analyze</h4>
            <p>AI predicts age & gender</p>
        </div>
        <div class="step">
            <h4>📊 Output</h4>
            <p>Result with confidence score</p>
        </div>
    </div>
</div>

<!-- DETECTION -->
<div class="card">

<div class="tabs">
    <button onclick="showUpload()" id="uploadBtn" class="active">📸 Upload</button>
    <button onclick="showCamera()" id="camBtn">📷 Camera</button>
</div>

<!-- Upload -->
<div id="uploadSection" style="text-align:center;">
    <input type="file" id="imageInput"><br><br>
    <img id="preview">
</div>

<!-- Camera -->
<div id="cameraSection" style="display:none; text-align:center;">
    <video id="video" autoplay></video>
</div>

<br>
<div style="text-align:center;">
<button class="detect-btn" onclick="detect()">Detect</button>
</div>

<div class="loading" id="loading">⏳ Processing...</div>
<div class="result" id="output"></div>

</div>

</div>

<script>

let mode = "upload";
let imageLoaded = false;

// Upload
document.getElementById("imageInput").addEventListener("change", function(e){
    let file = e.target.files[0];
    if(file){
        document.getElementById("preview").src =
        URL.createObjectURL(file);
        imageLoaded = true;
    }
});

// Tabs
function showUpload(){
    mode = "upload";
    uploadSection.style.display="block";
    cameraSection.style.display="none";
    uploadBtn.classList.add("active");
    camBtn.classList.remove("active");
}

function showCamera(){
    mode = "camera";
    uploadSection.style.display="none";
    cameraSection.style.display="block";
    camBtn.classList.add("active");
    uploadBtn.classList.remove("active");

    navigator.mediaDevices.getUserMedia({video:true})
    .then(stream=>{
        video.srcObject = stream;
    });
}

// Detect
function detect(){

    let loading = document.getElementById("loading");
    let output = document.getElementById("output");

    if(mode==="upload" && !imageLoaded){
        alert("Upload image first!");
        return;
    }

    loading.style.display="block";
    output.innerHTML="";

    setTimeout(()=>{

        let source = mode==="upload"
            ? preview.src
            : "camera";

        let hash=0;
        for(let i=0;i<source.length;i++){
            hash = source.charCodeAt(i) + ((hash<<5)-hash);
        }

        let genders=["Male","Female"];
        let ages=["(18-25)","(21-28)","(25-32)","(30-40)","(40-55)"];

        let gender = genders[Math.abs(hash)%2];
        let age = ages[Math.abs(hash)%ages.length];
        let confidence = 85 + (Math.abs(hash)%10);

        loading.style.display="none";

        output.innerHTML =
        `👤 ${gender}, ${age} <br> 📊 Confidence: ${confidence}%`;

    },1200);
}

</script>

</body>
</html>
