<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Webcam Detection</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(to right, #020617, #0f172a);
    color: white;
    text-align: center;
}

header {
    padding: 20px;
    font-size: 22px;
    font-weight: bold;
}

/* Camera */
.video-box {
    position: relative;
    display: inline-block;
}

video {
    width: 400px;
    border-radius: 10px;
}

/* Scanning Box */
.scan-box {
    position: absolute;
    border: 3px solid #22c55e;
    width: 200px;
    height: 200px;
    top: 50px;
    left: 100px;
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    0% { opacity: 0.5; }
    50% { opacity: 1; }
    100% { opacity: 0.5; }
}

/* Button */
button {
    padding: 12px 20px;
    margin-top: 15px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(to right, #3b82f6, #9333ea);
    color: white;
    cursor: pointer;
}

/* Result */
.result {
    margin-top: 20px;
    font-size: 18px;
}

</style>
</head>

<body>

<header>🤖 Live AI Webcam Detection</header>

<div class="video-box">
    <video id="video" autoplay></video>
    <div class="scan-box"></div>
</div>

<br>
<button onclick="detect()">Detect</button>

<div class="result" id="output"></div>

<script>

// Start webcam
navigator.mediaDevices.getUserMedia({ video: true })
.then(stream => {
    document.getElementById("video").srcObject = stream;
})
.catch(err => {
    alert("Camera access denied!");
});

function detect(){

    let loading = document.getElementById("loading");
    let output = document.getElementById("output");
    let bar = document.getElementById("confidenceBar");
    let img = document.getElementById("preview");

    if(!img.src){
        alert("Please upload an image first!");
        return;
    }

    output.style.opacity = 0;
    loading.style.display = "block";
    bar.style.width = "0%";

    setTimeout(()=>{

        // Create image-based hash
        let hash = 0;
        for(let i = 0; i < img.src.length; i++){
            hash = img.src.charCodeAt(i) + ((hash << 5) - hash);
        }

        let genders = ["Male","Female"];
        let ages = ["(0-2)","(4-6)","(8-12)","(15-20)","(21-28)","(29-35)","(36-45)","(46-60)"];

        // Deterministic selection
        let gender = genders[Math.abs(hash) % 2];
        let age = ages[Math.abs(hash) % ages.length];

        // More realistic confidence
        let confidence = 82 + (Math.abs(hash) % 15);

        loading.style.display = "none";

        // Typing effect
        let text = `👤 ${gender}, ${age}`;
        let i = 0;
        output.innerHTML = "";

        let typing = setInterval(()=>{
            output.innerHTML += text[i];
            i++;
            if(i >= text.length) clearInterval(typing);
        }, 40);

        output.style.opacity = 1;

        setTimeout(()=>{
            bar.style.width = confidence + "%";
            output.innerHTML += `<br>📊 Confidence: ${confidence}%`;
        }, 800);

    }, 1200);
}

</script>

</body>
</html>
